name: "Apple TV Content Launcher"
description: "Voice-controlled content launcher for Apple TV via webhook"
version: "1.0.0"
slug: "appletv-launcher"
init: false
arch:
  - aarch64
  - amd64
host_network: true
map:
  - config:rw
ports:
  8888/tcp: 8888
ports_description:
  8888/tcp: "Web API"
options:
  gemini_api_key: ""
  tmdb_api_key: ""
  apple_tv_id: ""
  streaming_availability_api_key: ""
  watchmode_api_key: ""
  dry_run: false
  log_level: "INFO"
schema:
  gemini_api_key: password
  tmdb_api_key: password
  apple_tv_id: str
  streaming_availability_api_key: password
  watchmode_api_key: password
  dry_run: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
